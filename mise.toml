min_version = "2024.11.1"

[tools]
rust = "stable"

[vars]
dist_dir = "dist"
linux_glibc = "2.17"

[env]
# Isolated cargo home / target so release binaries do not embed $HOME paths.
CARGO_HOME_DIR = "/tmp/zsync-cargo"
CARGO_TARGET_DIR = "/tmp/zsync-target"
DIST_DIR = "{{vars.dist_dir}}"
ZSYNC_LINUX_GLIBC = "{{vars.linux_glibc}}"

[tasks.format]
description = "Format the whole project (nightly rustfmt: rustfmt.toml unstable options)"
alias = ["fmt"]
tools = { rust = "nightly" }
run = "cargo fmt --all"

[tasks.release]
description = "Release-zip zsync (macOS / Linux / Windows) and zsyncd Linux x64 glibc 2.17"
alias = ["dist"]
tools = { zig = "0.14.0", "cargo:cargo-zigbuild" = "0.20.1" }
run = "bash scripts/release.sh"

[tasks."release:macos:arm64"]
description = "Release-zip macOS arm64 only"
run = "bash scripts/release.sh macos:arm64"

[tasks."release:linux:x64"]
description = "Release-zip Linux x64 only (glibc 2.17 via zigbuild when not native)"
tools = { zig = "0.14.0", "cargo:cargo-zigbuild" = "0.20.1" }
run = "bash scripts/release.sh linux:x64"

[tasks."release:zsyncd"]
description = "Release-zip zsyncd Linux x64 only (glibc 2.17)"
tools = { zig = "0.14.0", "cargo:cargo-zigbuild" = "0.20.1" }
run = "bash scripts/release.sh zsyncd"

[tasks."release:clean"]
description = "Remove release zip artifacts and the isolated cargo target cache"
run = "rm -rf {{vars.dist_dir}} /tmp/zsync-target"
